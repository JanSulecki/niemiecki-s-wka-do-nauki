<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening: Partizip Perfekt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-top: 0;
        }
        .hidden {
            display: none !important;
        }
        /* Ekran startowy */
        .mode-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .mode-btn:hover {
            background-color: #45a049;
        }
        /* Ekran quizu */
        #word-display {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .keyboard {
            margin-bottom: 20px;
        }
        .key-btn {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        .key-btn:hover {
            background-color: #d0d0d0;
        }
        .action-btn {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 80%;
        }
        .action-btn:hover {
            background-color: #007bb5;
        }
        #feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct { color: green; }
        .incorrect { color: red; }
        #progress {
            margin-bottom: 15px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Czasowniki Nieregularne</h1>
        <p>Wybierz ile słówek chcesz przećwiczyć:</p>
        <button class="mode-btn" onclick="startQuiz(10)">10 słów</button>
        <button class="mode-btn" onclick="startQuiz(15)">15 słów</button>
        <button class="mode-btn" onclick="startQuiz(20)">20 słów</button>
        <button class="mode-btn" onclick="startQuiz(30)">30 słów</button>
        <button class="mode-btn" onclick="startQuiz('all')">Wszystkie</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="progress">Słowo 1 / 10</div>
        <div style="font-size: 14px; color: #777;">Infinitiv:</div>
        <div id="word-display">backen</div>

        <input type="text" id="answer-input" placeholder="Wpisz Partizip Perfekt" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="keyboard">
            <button class="key-btn" onclick="insertChar('ä')">ä</button>
            <button class="key-btn" onclick="insertChar('ö')">ö</button>
            <button class="key-btn" onclick="insertChar('ü')">ü</button>
            <button class="key-btn" onclick="insertChar('ß')">ß</button>
        </div>

        <button id="check-btn" class="action-btn" onclick="handleAction()">Sprawdź</button>

        <div id="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h1>Koniec!</h1>
        <p style="font-size: 20px;">Twój wynik to: <strong id="score-display"></strong></p>
        <button class="action-btn" onclick="resetQuiz()" style="margin-top: 20px;">Zagraj ponownie</button>
    </div>
</div>

<script>
    // Baza słówek ze zdjęć użytkownika
    const allVerbs = [
        { inf: "backen", part: "gebacken" },
        { inf: "sich befinden", part: "befunden" },
        { inf: "beginnen", part: "begonnen" },
        { inf: "bekommen", part: "bekommen" },
        { inf: "besprechen", part: "besprochen" },
        { inf: "bitten", part: "gebeten" },
        { inf: "bleiben", part: "geblieben" },
        { inf: "bringen", part: "gebracht" },
        { inf: "denken", part: "gedacht" },
        { inf: "empfehlen", part: "empfohlen" },
        { inf: "essen", part: "gegessen" },
        { inf: "fahren", part: "gefahren" },
        { inf: "finden", part: "gefunden" },
        { inf: "fliegen", part: "geflogen" },
        { inf: "geben", part: "gegeben" },
        { inf: "gefallen", part: "gefallen" },
        { inf: "gehen", part: "gegangen" },
        { inf: "gewinnen", part: "gewonnen" },
        { inf: "haben", part: "gehabt" },
        { inf: "hängen", part: "gehangen" },
        { inf: "heißen", part: "geheißen" },
        { inf: "helfen", part: "geholfen" },
        { inf: "kennen", part: "gekannt" },
        { inf: "kommen", part: "gekommen" },
        { inf: "laden", part: "geladen" },
        { inf: "laufen", part: "gelaufen" },
        { inf: "leiden", part: "gelitten" },
        { inf: "leihen", part: "geliehen" },
        { inf: "liegen", part: "gelegen" },
        { inf: "nehmen", part: "genommen" },
        { inf: "nennen", part: "genannt" },
        { inf: "reiten", part: "geritten" },
        { inf: "rufen", part: "gerufen" },
        { inf: "schlafen", part: "geschlafen" },
        { inf: "schließen", part: "geschlossen" },
        { inf: "schreiben", part: "geschrieben" },
        { inf: "schwimmen", part: "geschwommen" },
        { inf: "sehen", part: "gesehen" },
        { inf: "sein", part: "gewesen" },
        { inf: "singen", part: "gesungen" },
        { inf: "sitzen", part: "gesessen" },
        { inf: "sprechen", part: "gesprochen" },
        { inf: "stehen", part: "gestanden" },
        { inf: "steigen", part: "gestiegen" },
        { inf: "sterben", part: "gestorben" },
        { inf: "streiten", part: "gestritten" },
        { inf: "tragen", part: "getragen" },
        { inf: "treffen", part: "getroffen" },
        { inf: "trinken", part: "getrunken" },
        { inf: "tun", part: "getan" },
        { inf: "verbringen", part: "verbracht" },
        { inf: "vergessen", part: "vergessen" },
        { inf: "verlieren", part: "verloren" },
        { inf: "verschreiben", part: "verschrieben" },
        { inf: "verstehen", part: "verstanden" },
        { inf: "wachsen", part: "gewachsen" },
        { inf: "waschen", part: "gewaschen" },
        { inf: "werden", part: "geworden" },
        { inf: "wissen", part: "gewusst" }
    ];

    let currentVerbs = [];
    let currentIndex = 0;
    let score = 0;
    let isWaitingForNext = false;

    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const wordDisplay = document.getElementById('word-display');
    const answerInput = document.getElementById('answer-input');
    const feedback = document.getElementById('feedback');
    const progress = document.getElementById('progress');
    const checkBtn = document.getElementById('check-btn');

    // Mieszanie tablicy (algorytm Fisher-Yates)
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [
                array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startQuiz(amount) {
        let shuffled = shuffle([...allVerbs]);

        if (amount === 'all') {
            currentVerbs = shuffled;
        } else {
            // Zabezpieczenie na wypadek gdyby żądano więcej słów niż jest w bazie
            currentVerbs = shuffled.slice(0, Math.min(amount, allVerbs.length));
        }

        currentIndex = 0;
        score = 0;

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');

        loadQuestion();
    }

    function loadQuestion() {
        isWaitingForNext = false;
        answerInput.value = '';
        answerInput.disabled = false;
        feedback.innerHTML = '';
        checkBtn.textContent = 'Sprawdź';
        checkBtn.style.backgroundColor = '#008CBA';

        wordDisplay.textContent = currentVerbs[currentIndex].inf;
        progress.textContent = `Słowo ${currentIndex + 1} z ${currentVerbs.length}`;
        answerInput.focus();
    }

    function insertChar(char) {
        const start = answerInput.selectionStart;
        const end = answerInput.selectionEnd;
        const text = answerInput.value;
        answerInput.value = text.slice(0, start) + char + text.slice(end);

        // Ustawienie kursora za wstawionym znakiem
        answerInput.selectionStart = answerInput.selectionEnd = start + 1;
        answerInput.focus();
    }

    function handleAction() {
        if (isWaitingForNext) {
            nextQuestion();
        } else {
            checkAnswer();
        }
    }

    function checkAnswer() {
        const userAnswer = answerInput.value.trim().toLowerCase();
        const correctAnswer = currentVerbs[currentIndex].part.toLowerCase();

        if (userAnswer === '') return; // Nie puszczaj pustego

        answerInput.disabled = true; // Blokujemy input
        isWaitingForNext = true;
        checkBtn.textContent = 'Dalej';
        checkBtn.style.backgroundColor = '#f39c12'; // Zmiana koloru na pomarańczowy dla przycisku "Dalej"

        if (userAnswer === correctAnswer) {
            feedback.innerHTML = '<span class="correct">✔ Dobrze!</span>';
            score++;
        } else {
            feedback.innerHTML = `<span class="incorrect">✘ Źle!</span> Poprawna odpowiedź: <strong>${currentVerbs[currentIndex].part}</strong>`;
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentVerbs.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        document.getElementById('score-display').textContent = `${score} / ${currentVerbs.length}`;
    }

    function resetQuiz() {
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    }

    // Obsługa klawisza Enter (jeden globalny nasłuchiwacz)
    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            // Uruchamiaj sprawdzanie/przechodzenie dalej tylko, gdy ekran quizu jest aktywny
            if (!quizScreen.classList.contains('hidden')) {
                event.preventDefault();
                handleAction();
            }
        }
    });
</script>

</body>
</html>
